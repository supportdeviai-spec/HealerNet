name: healernet

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: healernet-app
    container_name: healernet-app
    restart: always
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      SERVICE_NAME: app
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://healernet.org}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-healernet}
      DB_USERNAME: ${DB_USERNAME:-healernet_user}
      DB_PASSWORD: ${DB_PASSWORD:-healernet_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-support@healernet.org}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-HealerNet}
    volumes:
      - .:/var/www/html
      - ./docker/php/production.ini:/usr/local/etc/php/conf.d/local.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - healernet-network
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    image: nginx:alpine
    container_name: healernet-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certbot/www:/var/www/certbot:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - healernet-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: healernet-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-healernet}
      MYSQL_USER: ${DB_USERNAME:-healernet_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-healernet_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${DB_USERNAME:-healernet_user}", "-p${DB_PASSWORD:-healernet_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - healernet-network

  redis:
    image: redis:alpine
    container_name: healernet-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - healernet-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: healernet-app
    container_name: healernet-queue
    restart: always
    command: php artisan queue:work redis --tries=3 --timeout=90 --sleep=1
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      SERVICE_NAME: queue
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://healernet.org}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-healernet}
      DB_USERNAME: ${DB_USERNAME:-healernet_user}
      DB_PASSWORD: ${DB_PASSWORD:-healernet_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    volumes:
      - .:/var/www/html
      - ./docker/php/production.ini:/usr/local/etc/php/conf.d/local.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_started
    networks:
      - healernet-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: healernet-app
    container_name: healernet-scheduler
    restart: always
    command: php artisan schedule:work
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      SERVICE_NAME: scheduler
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://healernet.org}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-healernet}
      DB_USERNAME: ${DB_USERNAME:-healernet_user}
      DB_PASSWORD: ${DB_PASSWORD:-healernet_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
    volumes:
      - .:/var/www/html
      - ./docker/php/production.ini:/usr/local/etc/php/conf.d/local.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_started
    networks:
      - healernet-network

  certbot:
    image: certbot/certbot
    container_name: healernet-certbot
    restart: always
    volumes:
      - ./docker/certbot/www:/var/www/certbot
      - ./docker/certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done'"
    networks:
      - healernet-network

networks:
  healernet-network:
    driver: bridge

volumes:
  mysql_data:
    name: healernet_mysql_data
    driver: local
  redis_data:
    name: healernet_redis_data
    driver: local
